<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fJEY — FOR WHAT?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;800&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Plan : beaucoup de blanc cassé, un titre noir très gras, des filets fins, trois potards. Rien d'autre. */
:root{
  --bg:#f3f1ec;
  --ink:#111111;
  --muted:#8a867d;
  --hair:#d9d5cc;
  --tag:#e23b1b;
  --display:"Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.45}
.wrap{max-width:960px;margin:0 auto;padding:28px 24px 48px;display:flex;flex-direction:column;gap:48px}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.mark{font-weight:800;font-size:16px;letter-spacing:.02em}

/* Héros */
.hero{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end}
.title{font-weight:800;font-size:clamp(52px,11vw,124px);line-height:.88;letter-spacing:-.04em;margin:0;text-wrap:balance}
.title .word{display:inline-block;white-space:nowrap}
.title .ch{display:inline-block;transform-origin:50% 100%}
.by{margin:16px 0 0}
.stage{position:relative;width:220px;height:220px}
#viz{width:100%;height:100%;display:block}
.play{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:0;cursor:pointer;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.play:hover{background:var(--tag)}
.play:focus-visible{outline:2px solid var(--tag);outline-offset:4px}
.play svg{width:28px;height:28px}
.play[disabled]{opacity:.35;cursor:wait}

/* Forme d'onde */
.timeline{display:flex;flex-direction:column;gap:8px}
#wave{width:100%;height:56px;display:block;cursor:pointer}
#wave:focus-visible{outline:2px solid var(--tag);outline-offset:4px}
.times{display:flex;justify-content:space-between}

/* Potards */
.desk{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;border-top:1px solid var(--hair);padding-top:36px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ctl h3{margin:0;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.knob{width:104px;height:104px;border-radius:50%;position:relative;cursor:ns-resize;touch-action:none;background:transparent;border:1px solid var(--ink);outline:none}
.knob:focus-visible{box-shadow:0 0 0 3px var(--tag)}
.knob .arc{position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);overflow:visible}
.knob .ptr{position:absolute;left:50%;top:8px;width:2px;height:26px;margin-left:-1px;background:var(--ink);transform-origin:50% 44px}
.knob.live{border-color:var(--tag)}
.knob.live .ptr{background:var(--tag)}
.readout{font-family:var(--mono);font-size:12px;min-height:18px;font-variant-numeric:tabular-nums}
.readout.live{color:var(--tag)}
.leds{display:flex;gap:3px;height:6px}
.leds i{width:12px;height:6px;background:var(--hair)}
.leds i.on{background:var(--tag)}

/* Ton son */
.drop{border-top:1px solid var(--hair);padding-top:28px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.drop.over{outline:1px dashed var(--tag);outline-offset:8px}
.drop p{margin:0;max-width:56ch;color:var(--muted)}
.drop p b{color:var(--ink);font-weight:500}
.btn{font-family:var(--mono);font-size:12px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:9px 16px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .stage{margin:0 auto}
  .desk{grid-template-columns:1fr;gap:40px}
}
@media (prefers-reduced-motion:reduce){ .title .ch{transform:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">fJEY</div>
    <div class="mono"><span>125 BPM</span> · <span>Do♯ mineur</span> · <span id="dur">3:04</span></div>
  </header>

  <section class="hero" aria-label="Lecteur">
    <div>
      <h1 class="title" id="title" aria-label="FOR WHAT?"></h1>
      <p class="by mono" id="trackline">Par fJEY</p>
    </div>
    <div class="stage">
      <canvas id="viz" width="440" height="440" aria-hidden="true"></canvas>
      <button class="play" id="play" aria-label="Lecture" disabled>
        <svg id="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  </section>

  <section class="timeline" aria-label="Position dans le morceau">
    <canvas id="wave" height="112" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas>
    <div class="times mono"><span id="cur">0:00</span><span id="status">Chargement…</span><span id="tot">3:04</span></div>
  </section>

  <section class="desk" aria-label="Table de mixage">
    <div class="ctl">
      <h3>Filtre</h3>
      <div class="knob" id="k-filter" tabindex="0" role="slider" aria-label="Filtre, passe-bas à gauche, passe-haut à droite" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"></div>
      <div class="readout" id="r-filter">Ouvert</div>
    </div>
    <div class="ctl">
      <h3>Pumping</h3>
      <div class="knob" id="k-pump" tabindex="0" role="slider" aria-label="Pumping" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      <div class="readout" id="r-pump">0 %</div>
      <div class="leds" id="leds" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="ctl">
      <h3>Repeat</h3>
      <div class="knob" id="k-rep" tabindex="0" role="slider" aria-label="Répéteur" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"></div>
      <div class="readout" id="r-rep">Off</div>
    </div>
  </section>

  <section class="drop" id="drop" aria-label="Ton son">
    <p><b>Ton son.</b> Dépose un fichier audio pour le passer dans les potards. Il reste sur ton appareil.</p>
    <label class="btn" for="file">Choisir un fichier</label>
    <input type="file" id="file" accept="audio/*" hidden>
  </section>

  <footer class="mono"><span>FOR WHAT? — fJEY</span><span>Paris</span></footer>
</div>

<script>
(() => {
  const BPM = 125, BEAT = 60 / BPM;
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const titleEl = $('title');
  function setTitle(txt){
    titleEl.innerHTML = ''; titleEl.setAttribute('aria-label', txt);
    txt.split(' ').forEach((w, wi, arr) => {
      const word = document.createElement('span'); word.className = 'word'; word.setAttribute('aria-hidden','true');
      [...w].forEach(c => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; word.appendChild(s); });
      titleEl.appendChild(word); if (wi < arr.length - 1) titleEl.appendChild(document.createTextNode(' '));
    });
  }
  setTitle('FOR WHAT?');

  let ctx, buffer, src, startAt = 0, offset = 0, playing = false;
  let lp, hp, pumpGain, analyser, master;
  let filterV = 0, pumpV = 0;
  // Répéteur : longueurs en temps (1 mesure = 4 temps)
  const REP = [ {lab:'Off', beats:0}, {lab:'1 mesure', beats:4}, {lab:'1/2', beats:2}, {lab:'1/4', beats:1}, {lab:'1/8', beats:0.5}, {lab:'1/16', beats:0.25} ];
  let repIdx = 0, loopZone = null;
  const fmt = s => { s = Math.max(0, s|0); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };

  function ensureCtx(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 20000; lp.Q.value = 3;
    hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 20; hp.Q.value = 3;
    pumpGain = ctx.createGain();
    master = ctx.createGain(); master.gain.value = 0.9;
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.75;
    lp.connect(hp); hp.connect(pumpGain); pumpGain.connect(master); master.connect(analyser); analyser.connect(ctx.destination);
    applyFilter();
  }

  async function decode(ab){
    const tmp = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, 44100, 44100);
    return await new Promise((ok, ko) => tmp.decodeAudioData(ab, ok, ko));
  }
  async function useBuffer(buf){
    stop(); buffer = buf; offset = 0;
    $('tot').textContent = fmt(buf.duration); $('dur').textContent = fmt(buf.duration);
    computePeaks(); drawWave(); $('play').disabled = false; $('status').textContent = '';
  }
  (async () => {
    try { const r = await fetch('for-what.mp3'); if (!r.ok) throw 0; await useBuffer(await decode(await r.arrayBuffer())); }
    catch(e){ $('status').textContent = 'Morceau indisponible. Recharge la page.'; }
  })();

  // ---- Lecture : le temps du morceau continue même pendant une répétition ----
  function songNow(){ return playing ? Math.min(buffer.duration, ctx.currentTime - startAt) : offset; }
  function makeSource(){
    const s = ctx.createBufferSource(); s.buffer = buffer; s.connect(lp); return s;
  }
  function killSource(){ if (src){ try{ src.onended = null; src.stop(); }catch(e){} src.disconnect(); src = null; } }
  function launch(){
    // (re)lance la source au bon endroit : lecture normale ou boucle du répéteur
    killSource();
    const t = songNow();
    src = makeSource();
    const len = REP[repIdx].beats * BEAT;
    if (len > 0){
      const q = Math.floor(t / len) * len;
      loopZone = [q, Math.min(buffer.duration, q + len)];
      src.loop = true; src.loopStart = loopZone[0]; src.loopEnd = loopZone[1];
      src.start(0, t);
    } else {
      loopZone = null;
      src.onended = () => { if (playing && songNow() >= buffer.duration - 0.05){ playing = false; offset = 0; killSource(); setIcon(); } };
      src.start(0, t);
    }
  }
  function start(){
    ensureCtx(); if (ctx.state === 'suspended') ctx.resume();
    startAt = ctx.currentTime - offset; playing = true;
    nextBeat = Math.ceil(offset / BEAT - 1e-6);
    launch(); setIcon();
  }
  function stop(){
    if (playing) offset = songNow();
    killSource(); playing = false; loopZone = null; setIcon();
    if (pumpGain){ pumpGain.gain.cancelScheduledValues(0); pumpGain.gain.value = 1; }
  }
  function seek(t){ const was = playing; if (was) stop(); offset = Math.max(0, Math.min(buffer.duration - 0.01, t)); if (was) start(); drawWave(); }
  function setIcon(){
    $('icon').innerHTML = playing ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    $('play').setAttribute('aria-label', playing ? 'Pause' : 'Lecture');
  }
  $('play').addEventListener('click', () => { if (!buffer) return; playing ? stop() : start(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); $('play').click(); } });

  // ---- Pumping calé sur la grille ----
  let nextBeat = 0;
  setInterval(() => {
    if (!playing || !ctx) return;
    const horizon = songNow() + 0.25;
    while (nextBeat * BEAT < horizon){
      const when = startAt + nextBeat * BEAT;
      if (when >= ctx.currentTime - 0.005 && pumpV > 0){
        const g = pumpGain.gain;
        g.setValueAtTime(1, Math.max(ctx.currentTime, when - 0.004));
        g.linearRampToValueAtTime(1 - pumpV * 0.85, when + 0.012);
        g.setTargetAtTime(1, when + 0.04, 0.09);
      }
      nextBeat++;
    }
  }, 40);

  // ---- Filtre DJ ----
  const hzLabel = f => f >= 1000 ? (f/1000).toFixed(f >= 10000 ? 0 : 1).replace('.', ',') + ' kHz' : Math.round(f) + ' Hz';
  function applyFilter(){
    const v = filterV;
    const lpF = v < 0 ? 20000 * Math.pow(180/20000, -v) : 20000;
    const hpF = v > 0 ? 20 * Math.pow(4000/20, v) : 20;
    if (lp){ lp.frequency.setTargetAtTime(lpF, ctx.currentTime, 0.02); hp.frequency.setTargetAtTime(hpF, ctx.currentTime, 0.02); }
    $('r-filter').textContent = Math.abs(v) < 0.02 ? 'Ouvert' : (v < 0 ? 'Passe-bas ' + hzLabel(lpF) : 'Passe-haut ' + hzLabel(hpF));
  }

  // ---- Potards ----
  function makeKnob(el, o){
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 124 124'); svg.classList.add('arc');
    const track = document.createElementNS(NS,'path'), fill = document.createElementNS(NS,'path');
    [track, fill].forEach(p => { p.setAttribute('fill','none'); p.setAttribute('stroke-width','2'); svg.appendChild(p); });
    track.setAttribute('stroke','#d9d5cc'); fill.setAttribute('stroke','#111111');
    const ptr = document.createElement('div'); ptr.className = 'ptr'; el.appendChild(svg); el.appendChild(ptr);
    const A0 = -135, A1 = 135, R = 58;
    const pt = a => { const r = (a-90) * Math.PI/180; return [62 + R*Math.cos(r), 62 + R*Math.sin(r)]; };
    const arc = (a, b) => { if (Math.abs(b-a) < .5) return ''; const [x0,y0] = pt(Math.min(a,b)), [x1,y1] = pt(Math.max(a,b)); return `M${x0} ${y0} A${R} ${R} 0 ${Math.abs(b-a) > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
    track.setAttribute('d', arc(A0, A1));
    if (o.steps){ for (let i = 0; i <= o.steps; i++){ const a = A0 + i/o.steps*(A1-A0), [x,y] = pt(a); const d = document.createElementNS(NS,'circle'); d.setAttribute('cx',x); d.setAttribute('cy',y); d.setAttribute('r','2.5'); d.setAttribute('fill','#111111'); svg.appendChild(d); } }
    let v = o.value;
    const q = x => o.steps ? Math.round((x - o.min) / (o.max - o.min) * o.steps) / o.steps * (o.max - o.min) + o.min : x;
    function render(){
      const a = A0 + (v - o.min) / (o.max - o.min) * (A1 - A0);
      fill.setAttribute('d', o.steps ? '' : arc(o.min < 0 ? 0 : A0, a));
      ptr.style.transform = `rotate(${a}deg)`;
      el.setAttribute('aria-valuenow', o.steps ? Math.round(v) : Math.round(v*100));
    }
    function set(nv){ const nq = q(Math.max(o.min, Math.min(o.max, nv))); if (nq === v) return; v = nq; render(); o.onChange(v); }
    let y0, v0;
    el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); y0 = e.clientY; v0 = v; el.focus(); });
    el.addEventListener('pointermove', e => { if (y0 == null) return; set(v0 + (y0 - e.clientY) / 160 * (o.max - o.min)); });
    const end = () => { y0 = null; }; el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('dblclick', () => set(o.value));
    el.addEventListener('wheel', e => { e.preventDefault(); set(v - Math.sign(e.deltaY) * (o.steps ? (o.max-o.min)/o.steps : 0.04*(o.max-o.min))); }, {passive:false});
    el.addEventListener('keydown', e => {
      const step = o.steps ? (o.max-o.min)/o.steps : 0.05*(o.max-o.min);
      if (['ArrowUp','ArrowRight'].includes(e.key)){ e.preventDefault(); set(v + step); }
      if (['ArrowDown','ArrowLeft'].includes(e.key)){ e.preventDefault(); set(v - step); }
      if (e.key === 'Home'){ e.preventDefault(); set(o.value); }
    });
    render();
  }
  makeKnob($('k-filter'), { min:-1, max:1, value:0, onChange: x => { filterV = x; applyFilter(); } });
  makeKnob($('k-pump'), { min:0, max:1, value:0, onChange: x => { pumpV = x; $('r-pump').textContent = Math.round(x*100) + ' %'; } });
  makeKnob($('k-rep'), { min:0, max:5, steps:5, value:0, onChange: x => {
    repIdx = Math.round(x);
    const on = repIdx > 0;
    $('r-rep').textContent = REP[repIdx].lab; $('r-rep').classList.toggle('live', on); $('k-rep').classList.toggle('live', on);
    if (playing) launch();
  } });
  applyFilter();

  // ---- Forme d'onde ----
  const wave = $('wave'); let peaks = [];
  function computePeaks(){
    const n = 480, ch = buffer.getChannelData(0), step = Math.floor(ch.length / n); peaks = [];
    for (let i = 0; i < n; i++){ let m = 0; for (let j = i*step, e = j+step; j < e; j += 16){ const a = Math.abs(ch[j]); if (a > m) m = a; } peaks.push(m); }
    const mx = Math.max(...peaks) || 1; peaks = peaks.map(p => p / mx);
  }
  function drawWave(){
    const w = wave.width = wave.clientWidth * 2, h = wave.height, g = wave.getContext('2d');
    g.clearRect(0,0,w,h); if (!peaks.length) return;
    const t = buffer ? songNow() : 0, prog = t / buffer.duration, bw = w / peaks.length;
    if (loopZone){ g.fillStyle = 'rgba(226,59,27,.12)'; g.fillRect(loopZone[0]/buffer.duration*w, 0, Math.max(3,(loopZone[1]-loopZone[0])/buffer.duration*w), h); }
    peaks.forEach((p, i) => {
      const bh = Math.max(2, p * (h - 12)), x = i*bw, ti = (i/peaks.length)*buffer.duration;
      const inLoop = loopZone && ti >= loopZone[0] && ti < loopZone[1];
      g.fillStyle = inLoop ? '#e23b1b' : ((i / peaks.length) < prog ? '#111111' : '#cfcbc2');
      g.fillRect(x, (h - bh)/2, Math.max(1, bw - 2), bh);
    });
    wave.setAttribute('aria-valuenow', Math.round(prog*100));
    $('cur').textContent = fmt(t);
  }
  wave.addEventListener('click', e => { if (!buffer) return; const r = wave.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * buffer.duration); });
  wave.addEventListener('keydown', e => { if (!buffer) return; if (e.key === 'ArrowRight'){ e.preventDefault(); seek(songNow() + 5); } if (e.key === 'ArrowLeft'){ e.preventDefault(); seek(songNow() - 5); } });
  addEventListener('resize', drawWave);

  // ---- Visuel ----
  const viz = $('viz'), vg = viz.getContext('2d'); let fbuf, tbuf; const leds = [...document.querySelectorAll('#leds i')];
  function frame(){
    requestAnimationFrame(frame);
    const W = viz.width, H = viz.height, cx = W/2, cy = H/2;
    vg.clearRect(0,0,W,H);
    let level = 0;
    if (analyser){
      fbuf = fbuf || new Uint8Array(analyser.frequencyBinCount); tbuf = tbuf || new Uint8Array(analyser.fftSize);
      analyser.getByteFrequencyData(fbuf); analyser.getByteTimeDomainData(tbuf);
      let s = 0; for (const x of tbuf){ const d = (x-128)/128; s += d*d; } level = Math.sqrt(s / tbuf.length);
    }
    const bars = 64, r0 = 120;
    vg.lineWidth = 3;
    for (let i = 0; i < bars; i++){
      const bin = fbuf ? fbuf[Math.floor(Math.pow(i / bars, 1.7) * 300) + 2] / 255 : 0;
      const len = 4 + (playing ? bin : 0) * 80, a = i / bars * Math.PI * 2 - Math.PI/2;
      vg.strokeStyle = loopZone ? `rgba(226,59,27,${0.3 + bin*0.7})` : `rgba(17,17,17,${0.18 + bin*0.82})`;
      vg.beginPath(); vg.moveTo(cx + Math.cos(a)*r0, cy + Math.sin(a)*r0); vg.lineTo(cx + Math.cos(a)*(r0+len), cy + Math.sin(a)*(r0+len)); vg.stroke();
    }
    const g = pumpGain ? pumpGain.gain.value : 1;
    if (!reduce){
      const sc = playing ? 1 + Math.min(0.07, level * 0.3) * g : 1;
      titleEl.querySelectorAll('.ch').forEach(s => { s.style.transform = `scaleY(${sc})`; });
    }
    const lit = playing ? Math.round((1 - g) / 0.85 * 8) : 0;
    leds.forEach((l, i) => l.classList.toggle('on', i < lit));
    if (playing) drawWave();
  }
  requestAnimationFrame(frame);

  // ---- Ton son ----
  const drop = $('drop');
  async function takeFile(f){
    if (!f) return;
    $('status').textContent = 'Lecture du fichier…';
    try {
      const buf = await decode(await f.arrayBuffer());
      setTitle(f.name.replace(/\.[^.]+$/, '').slice(0, 28)); $('trackline').textContent = 'Ton son';
      await useBuffer(buf);
    } catch(e){ $('status').textContent = 'Fichier illisible. Essaie un MP3 ou un WAV.'; }
  }
  $('file').addEventListener('change', e => takeFile(e.target.files[0]));
  ['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => takeFile(e.dataTransfer.files[0]));
})();
</script>
</body>
</html>
